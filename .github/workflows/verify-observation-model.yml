name: Verify robustness observation model

on:
  push:
    branches:
      - research/observation-channel-sensor-realism-20261111
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.5.4" "pytest==9.1.1"
      - name: Test causal sensor observation contract
        run: python -m pytest -q tests/test_observation_model.py
