name: Verify provisional NASA NACA 2412 comparison

on:
  push:
    branches:
      - research/nasa2412-figure6-digitization-20261111
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6"
      - name: Validate CSV and run non-fitting comparison
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("experiments/physical_validation/data/nasa_cr197497_figure6a_digitized_approx.csv")
          with path.open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 47, len(rows)
          expected = {"WSU_clean", "WSU_grit", "Ref9_clean", "NACA_grit_Ref9"}
          assert {r["series"] for r in rows} == expected
          assert all(len(r) == 10 and r["digitization_status"] == "approx_digitized_from_scan" for r in rows)
          print(f"PASS: {len(rows)} provisional points, 4 conditions, 10 columns each.")
          PY
          python experiments/physical_validation/compare_nasa2412_figure6a.py
