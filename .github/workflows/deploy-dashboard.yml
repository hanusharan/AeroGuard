name: Deploy AeroGuard Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      # `paper/` is the source of truth; `paper/build_paper.py` publishes the
      # rendered HTML/PDF/figures into dashboard/public/paper/, which Vite
      # copies into dist/ verbatim. That keeps `npm run dev` and the deployed
      # site serving the same files, so nothing is copied here -- this step
      # only fails the build if the published copy is missing or stale.
      - name: Verify published research paper
        run: |
          test -f dashboard/dist/paper/AeroGuard_Research_Paper.html
          test -f dashboard/dist/paper/AeroGuard_Research_Paper.pdf
          test -f dashboard/dist/paper/figures/fig1_pipeline.png
          test -f dashboard/dist/paper/figures/fig4_generalization.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
